services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: tariflex/app
    container_name: tariflex-app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    working_dir: /var/www/html
    tty: true
    stdin_open: true
